name: Coal price CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: project_materials_2026-10-16/requirements-test.txt
      - run: pip install -r project_materials_2026-10-16/requirements-test.txt
      - run: python project_materials_2026-10-16/scripts/check_project.py
      - run: python -m unittest discover -s project_materials_2026-10-16/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check inference/static/app.js
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: ./inference
          file: ./inference/dockerfile
          load: true
          tags: coal-price:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Real models and full weekly forecast under 512 MB
        run: >-
          docker run --rm --memory=512m
          -v "$PWD/project_materials_2026-10-16/examples:/requests:ro"
          coal-price:test python smoke_test.py --request /requests/request-week.json
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag coal-price:test "$IMAGE:${{ github.sha }}"
          docker tag coal-price:test "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
  deploy:
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deployment for the verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          url = os.environ['RENDER_DEPLOY_HOOK_URL']
          if not url.startswith('https://api.render.com/deploy/'):
              raise SystemExit('Configure a valid Render deploy hook in GitHub secrets')
          separator = '&' if '?' in url else '?'
          url += separator + urllib.parse.urlencode({'ref': os.environ['VERIFIED_SHA']})
          with urllib.request.urlopen(urllib.request.Request(url, method='POST'), timeout=30) as response:
              if response.status not in (200, 201, 202):
                  raise SystemExit('Render rejected the deployment')
          print('Deployment requested. Check Render for final health and rollout status.')
          PY
